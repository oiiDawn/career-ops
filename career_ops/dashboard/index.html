<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Career Ops Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232f6fde'/%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7385; --line: #e3e6ec;
  --accent: #2f6fde; --accent-soft: #e8f0fd; --hover: #f1f4f9;
  --focus: #18794e; --focus-bg: #e4f5ec; --depri: #9a6700; --depri-bg: #fbf1d9;
  --discard: #b42318; --discard-bg: #fde8e7; --neutral-bg: #eef0f4;
  --shadow: 0 8px 30px rgba(20, 30, 50, .14);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1a1e26; --text: #e5e8ee; --muted: #949cad; --line: #2b313c;
    --accent: #6d9ef5; --accent-soft: #1e2a40; --hover: #212733;
    --focus: #5fd39a; --focus-bg: #173326; --depri: #e8bd5a; --depri-bg: #352b14;
    --discard: #f3877e; --discard-bg: #3a1c1a; --neutral-bg: #262c37;
    --shadow: 0 8px 30px rgba(0, 0, 0, .5);
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: var(--panel);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 16px; margin: 0; font-weight: 650; }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
.tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tab .count { font-size: 12px; margin-left: 4px; opacity: .8; }
.spacer { flex: 1; }
.updated { color: var(--muted); font-size: 12px; }
button.ghost, a.ghost { border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 5px 10px;
  border-radius: 6px; cursor: pointer; font: inherit; text-decoration: none; }
button.ghost:hover, a.ghost:hover { background: var(--hover); }
.filters { display: flex; gap: 8px; padding: 12px 24px; flex-wrap: wrap; align-items: center; }
.filters input, .filters select, .record input, .record select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 8px; }
.filters input[type=search] { width: 260px; }
.filters label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.filters.companies label { display: none; }
main { padding: 0 24px 24px; }
.table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; user-select: none;
  position: sticky; top: 0; background: var(--panel); }
th.sorted { color: var(--accent); }
th .arrow { font-size: 10px; margin-left: 2px; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--hover); }
tbody tr.selected { background: var(--accent-soft); }
tbody tr.expand, tbody tr.expand:hover { background: none; cursor: auto; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
td .role { font-weight: 550; }
td .sub { color: var(--muted); font-size: 12px; }
.ext { margin-left: 4px; font-size: 12px; }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: var(--neutral-bg);
  color: var(--muted); white-space: nowrap; }
.pill.focus, .pill.pass, .pill.active, .pill.applied, .pill.offer, .pill.hired { background: var(--focus-bg); color: var(--focus); }
.pill.deprioritize, .pill.uncertain, .pill.unknown, .pill.responded, .pill.interview { background: var(--depri-bg); color: var(--depri); }
.pill.discard, .pill.fail, .pill.needs_rescore, .pill.expired, .pill.closed, .pill.rejected, .pill.ineligible { background: var(--discard-bg); color: var(--discard); }
.dims { display: flex; gap: 4px; }
.dim { min-width: 36px; padding: 0 4px; text-align: center; border-radius: 4px; font-size: 12px; font-variant-numeric: tabular-nums;
  background: var(--neutral-bg); color: var(--muted); }
.dim.hi { background: var(--focus-bg); color: var(--focus); }
.dim.mid { background: var(--depri-bg); color: var(--depri); }
.dim.lo { background: var(--discard-bg); color: var(--discard); }
.dim.weak { opacity: .5; outline: 1px dashed currentColor; outline-offset: -1px; }
.dim-table { width: 100%; font-size: 13px; margin-bottom: 8px; }
.dim-table th { position: static; cursor: auto; }
.dim-table td:first-child, .dim-table td.verdict { white-space: nowrap; }
.empty { padding: 40px; text-align: center; color: var(--muted); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(860px, 100vw); background: var(--panel);
  box-shadow: var(--shadow); transform: translateX(100%); transition: transform .2s ease; z-index: 10;
  display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer-head { padding: 16px 20px 0; border-bottom: 1px solid var(--line); }
.drawer-head h2 { margin: 0 0 4px; font-size: 18px; }
.drawer-head .meta { color: var(--muted); font-size: 13px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.drawer-head .close { position: absolute; right: 16px; top: 14px; }
.actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
button.primary { border: 1px solid var(--accent); background: var(--accent); color: #fff; padding: 5px 12px;
  border-radius: 6px; cursor: pointer; font: inherit; font-weight: 600; }
button.primary:disabled { opacity: .6; cursor: progress; }
.banner { border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }
.banner.failed { border-left-color: var(--discard); }
.banner pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.drawer-tabs { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; }
.drawer-tabs .tab { border-radius: 6px 6px 0 0; }
.drawer-body { padding: 16px 20px 40px; overflow-y: auto; flex: 1; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; margin-bottom: 16px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }
.section-title { font-size: 13px; font-weight: 650; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
.card h4 { margin: 0 0 6px; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.md { line-height: 1.65; overflow-wrap: anywhere; }
.md table { border: 1px solid var(--line); margin: 8px 0; font-size: 13px; }
.md th { position: static; cursor: auto; }
.report td:first-child, .report td:nth-child(3) { white-space: nowrap; }
.md h1, .md h2 { font-size: 16px; border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-top: 22px; }
.md h3 { font-size: 15px; }
.md code { background: var(--neutral-bg); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--neutral-bg); padding: 10px; border-radius: 6px; overflow-x: auto; }
pre.plain { white-space: pre-wrap; word-break: break-word; font: inherit; margin: 0; }
details summary { cursor: pointer; font-weight: 600; }
.material-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.material-nav button.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.error { color: var(--discard); padding: 16px; }
.record { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.record input[name=notes] { flex: 1; min-width: 160px; }
.record .error { padding: 0; flex-basis: 100%; white-space: pre-wrap; }
@media (max-width: 720px) {
  header, .filters, main { padding-left: 16px; padding-right: 16px; }
  .filters input[type=search] { width: 100%; }
  .kv { grid-template-columns: 1fr; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>Career Ops</h1>
  <nav class="tabs" id="stageTabs"></nav>
  <span class="spacer"></span>
  <span class="updated" id="updated"></span>
  <button class="ghost" id="refresh" title="重新读取数据库">刷新</button>
</header>

<section class="filters" id="filters">
  <input type="search" id="q" placeholder="搜索公司 / 职位 / 地点 / ID">
  <label>决策 <select id="fAction"><option value="">全部</option><option value="focus">focus</option>
    <option value="deprioritize">deprioritize</option><option value="discard">discard</option><option value="none">未打分</option><option value="needs_rescore">待重新评分</option></select></label>
  <label>状态 <select id="fState"></select></label>
  <label>来源 <select id="fSource"></select></label>
  <label>存活 <select id="fLiveness"></select></label>
  <label><input type="checkbox" id="fMaterials"> 仅有材料</label>
  <button class="ghost" id="reset">重置</button>
</section>

<main>
  <div class="table-wrap">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>没有符合条件的职位</div>
  </div>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-head">
    <button class="ghost close" id="close">关闭 ✕</button>
    <h2 id="dTitle"></h2>
    <div class="meta" id="dMeta"></div>
    <div class="actions" id="dActions"></div>
    <nav class="drawer-tabs" id="dTabs"></nav>
  </div>
  <div class="drawer-body" id="dBody"></div>
</aside>

<script>
const DIMS = { direction: "方向", company: "公司", culture: "文化", compensation: "薪酬" };
const STAGES = [
  { key: "all", label: "全部" },
  { key: "scanned", label: "已扫描" },
  { key: "scored", label: "已打分" },
  { key: "applied", label: "已投递" },
  { key: "companies", label: "公司" },
];
const COLUMNS = [
  { key: "id", label: "ID", num: true },
  { key: "company", label: "公司 / 职位" },
  { key: "location", label: "地点", cls: "hide-sm" },
  { key: "dims", label: "方向·公司·文化·薪酬", sortValue: j => j.scores ? (j.scores.direction ?? 0) : -1 },
  { key: "capability", label: "核心能力", cls: "hide-sm", sortValue: j => j.capability_counts ? -(j.capability_counts.gap * 100 + j.capability_counts.adjacent + j.capability_counts.unverified) : null },
  { key: "action", label: "决策" },
  { key: "state", label: "状态" },
  { key: "application_status", label: "投递" },
  { key: "created_at", label: "发现时间", cls: "hide-sm" },
  { key: "scored_at", label: "打分时间", cls: "hide-sm" },
];
const COMPANY_DIMS = ["company", "culture", "compensation"];
const COMPANY_COLUMNS = [
  { key: "name", label: "公司" },
  ...COMPANY_DIMS.map(k => ({ key: k, label: DIMS[k], sortValue: c => c.means[k] })),
  { key: "avg", label: "平均" },
  { key: "jobCount", label: "岗位数" },
  { key: "valid_until", label: "最早到期" },
];
const DETAIL_TABS = [
  { key: "overview", label: "概览" },
  { key: "report", label: "打分报告" },
  { key: "jd", label: "JD" },
  { key: "materials", label: "投递材料" },
  { key: "interviews", label: "面试" },
  { key: "timeline", label: "投递记录" },
];
const STORAGE_KEY = "career-ops-dashboard";
const $ = id => document.getElementById(id);

let jobs = [];
let detail = null;
let openCompany = null;
const runs = {};
const POLL_MS = 3000;
let state = loadState();

function loadState() {
  const fallback = { stage: "all", sort: "id", dir: "desc", csort: "avg", cdir: "desc", q: "", action: "", state: "", source: "", liveness: "", materials: false };
  try { return { ...fallback, ...JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") }; }
  catch { return fallback; }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch { /* storage unavailable */ }
}

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function md(text) {
  if (!text) return '<p class="sub">无内容</p>';
  if (window.marked && window.DOMPurify) return `<div class="md">${DOMPurify.sanitize(marked.parse(text))}</div>`;
  return `<pre class="plain">${esc(text)}</pre>`;
}
function pill(value) { return value ? `<span class="pill ${esc(value)}">${esc(value === "needs_rescore" ? "待重新评分" : value)}</span>` : '<span class="sub">—</span>'; }
function shortDate(value) { return value ? esc(String(value).slice(0, 10)) : "—"; }
function safeUrl(url) { return /^https?:\/\//i.test(url || "") ? url : "#"; }
function jobLink(job, text = "↗") {
  return `<a class="ext" href="${esc(safeUrl(job.url))}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="打开职位链接">${text}</a>`;
}
// Mirrors decisions.worth_attention: every dimension >3, at least two >4. Confidence/sufficiency are informational.
const WEAK = 0.6;
function band(v) { return v == null ? "" : v > 4 ? "hi" : v > 3 ? "mid" : "lo"; }
function weak(d) { return d && d.score != null && (d.confidence < WEAK || d.evidence_sufficiency < WEAK); }
function pct(v) { return v == null ? "—" : Math.round(v * 100) + "%"; }
function dimTitle(k, d = {}) {
  return d.score == null ? `${DIMS[k]}：未评分（${d.reason || "unknown"}）`
    : `${DIMS[k]} ${d.score.toFixed(2)} · 置信度 ${pct(d.confidence)} · 充分度 ${pct(d.evidence_sufficiency)}`;
}
function dimCell(k, d) {
  return `<span class="dim ${band(d.score)} ${weak(d) ? "weak" : ""}" title="${esc(dimTitle(k, d))}">${d.score == null ? "—" : d.score.toFixed(2)}</span>`;
}
function dims(scores, dimensions = {}) {
  if (!scores) return '<span class="sub">—</span>';
  return `<span class="dims">${Object.keys(DIMS).map(k => dimCell(k, { ...dimensions[k], score: scores[k] })).join("")}</span>`;
}
function scopeText(ref) { return Object.entries(ref.scope || {}).map(([a, b]) => `${a}=${b}`).join(", "); }
function expired(ref) { return Boolean(ref.valid_until) && ref.valid_until < new Date().toISOString().slice(0, 10); }
function dimSource(d, k) {
  const ref = (d.company_profiles || {})[k];
  if (!ref) return '<span class="sub">岗位 JD</span>';
  if (ref.source === "explicit_job_quotation") return "JD 明确薪资";
  return `${esc(scopeText(ref))} <span class="sub">至 ${esc(ref.valid_until || "—")}</span>${expired(ref) ? " " + pill("expired") : ""}`;
}
function dimTable(d) {
  if (!d.scores) return "";
  const rows = Object.keys(DIMS).map(k => {
    const x = { ...(d.dimensions || {})[k], score: d.scores[k] };
    const probs = x.probabilities ? Object.entries(x.probabilities).filter(([, p]) => p >= .05).map(([s, p]) => `${+s + 1}:${pct(p)}`).join(" ") : "";
    return `<tr><td>${DIMS[k]}</td><td>${dimCell(k, x)}</td>
      <td class="num">${pct(x.confidence)}</td><td class="num">${pct(x.evidence_sufficiency)}</td>
      <td>${x.score == null ? `<span class="sub">${esc(x.reason || "")}</span>` : `<span class="sub">${esc(probs)}</span>`}</td><td>${dimSource(d, k)}</td></tr>`;
  }).join("");
  return `<div class="section-title">维度评分</div><table class="dim-table"><thead><tr><th>维度</th><th>分数</th><th>置信度</th><th>充分度</th><th>分布 / 原因</th><th>来源</th></tr></thead><tbody>${rows}</tbody></table>`;
}

async function readJson(response) {
  const text = await response.text();
  try { return JSON.parse(text); }
  catch { throw new Error(`HTTP ${response.status} ${response.statusText}（服务返回的不是 JSON，可能需要重启 dashboard）`); }
}

async function loadJobs() {
  $("refresh").disabled = true;
  try {
    const response = await fetch("/api/jobs");
    const body = await readJson(response);
    if (!response.ok) throw new Error(body.error || response.statusText);
    jobs = body;
    jobs.filter(j => j.run?.status === "running" && runs[j.id]?.status !== "running").forEach(j => { runs[j.id] = { ...j.run }; pollRun(j.id); });
    $("updated").textContent = "更新于 " + new Date().toLocaleTimeString();
    fillSelects();
    render();
  } catch (error) {
    $("rows").innerHTML = `<tr><td colspan="${COLUMNS.length}" class="error">加载失败：${esc(error.message)}</td></tr>`;
  } finally {
    $("refresh").disabled = false;
  }
}

function fillSelects() {
  const options = (key, id) => {
    const values = [...new Set(jobs.map(j => j[key]).filter(Boolean))].sort();
    if (!values.includes(state[key])) state[key] = "";
    $(id).innerHTML = `<option value="">全部</option>` + values.map(v => `<option>${esc(v)}</option>`).join("");
    $(id).value = state[key];
  };
  options("state", "fState");
  options("source", "fSource");
  options("liveness", "fLiveness");
}

function inStage(job, stage) {
  if (stage === "all") return true;
  if (stage === "scored") return job.stage === "scored" || (job.stage === "applied" && job.scores);
  return job.stage === stage;
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return jobs.filter(j => inStage(j, state.stage)
    && (!q || [j.id, j.company, j.role, j.location, j.source].some(v => String(v ?? "").toLowerCase().includes(q)))
    && (!state.action || (state.action === "none" ? !j.scores : state.action === "needs_rescore" ? j.needs_rescore : j.action === state.action))
    && (!state.state || j.state === state.state)
    && (!state.source || j.source === state.source)
    && (!state.liveness || j.liveness === state.liveness)
    && (!state.materials || j.material_count > 0));
}

// The company view keeps its own sort so switching tabs does not reset the job list's.
function sortKeys() { return state.stage === "companies" ? ["csort", "cdir"] : ["sort", "dir"]; }
function sorted(list, columns) {
  const [sortKey, dirKey] = sortKeys();
  const column = columns.find(c => c.key === state[sortKey]) || columns[0];
  const value = column.sortValue || (j => j[column.key]);
  const direction = state[dirKey] === "asc" ? 1 : -1;
  const tie = (a, b) => (b.id > a.id) - (b.id < a.id);
  return [...list].sort((a, b) => {
    const x = value(a), y = value(b);
    if (x == null && y == null) return tie(a, b);
    if (x == null) return 1;
    if (y == null) return -1;
    const result = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "zh-CN");
    return result * direction || tie(a, b);
  });
}

function mean(values) { return values.length ? values.reduce((a, b) => a + b, 0) / values.length : null; }
// Company-level ratings as the currently scored jobs reference them, one entry per company_id.
function companies() {
  const byId = new Map();
  for (const job of jobs.filter(j => inStage(j, "scored"))) {
    for (const k of COMPANY_DIMS) {
      const ref = (job.company_profiles || {})[k];
      if (!ref?.company_id || !ref.profile_id) continue;
      if (!byId.has(ref.company_id)) byId.set(ref.company_id, { names: new Set(), jobs: new Map(), profiles: new Map() });
      const company = byId.get(ref.company_id);
      company.names.add(job.company);
      company.jobs.set(job.id, job);
      // A profile is re-rated once it expires; jobs scored earlier still carry the old rating, so keep the newest.
      const seen = company.profiles.get(ref.profile_id);
      const rating = seen && !((ref.valid_until || "") > (seen.valid_until || "")) ? seen
        : { ...(job.dimensions || {})[k], ...ref, dim: k, score: (job.scores || {})[k] ?? null };
      company.profiles.set(ref.profile_id, { ...rating, jobCount: (seen?.jobCount || 0) + 1 });
    }
  }
  return [...byId].map(([id, c]) => {
    const profiles = [...c.profiles.values()].sort((a, b) =>
      COMPANY_DIMS.indexOf(a.dim) - COMPANY_DIMS.indexOf(b.dim) || scopeText(a).localeCompare(scopeText(b)));
    const means = Object.fromEntries(COMPANY_DIMS.map(k => [k, mean(profiles.filter(p => p.dim === k && p.score != null).map(p => p.score))]));
    return {
      id, name: [...c.names].sort().join(" / "), jobs: [...c.jobs.values()].sort((a, b) => b.id - a.id), jobCount: c.jobs.size, profiles, means,
      avg: mean(Object.values(means).filter(v => v != null)),
      valid_until: profiles.map(p => p.valid_until).filter(Boolean).sort()[0] || null,
    };
  });
}
function companyDimCell(company, k) {
  const scored = company.profiles.filter(p => p.dim === k && p.score != null);
  if (scored.length < 2) return dimCell(k, scored[0] || { score: null, reason: company.profiles.find(p => p.dim === k)?.reason || "no_profile" });
  const scores = scored.map(p => p.score).sort((a, b) => a - b);
  return `<span class="dim ${band(scores[0])} ${scored.some(weak) ? "weak" : ""}" title="${esc(scored.map(p => `${scopeText(p)}: ${p.score.toFixed(2)}`).join("\n"))}">${scores[0].toFixed(2)}–${scores.at(-1).toFixed(2)} ×${scored.length}</span>`;
}
function companyDetail(company) {
  return `<div class="section-title">公司级评分</div>
    <table class="dim-table"><thead><tr><th>维度</th><th>适用范围</th><th>分数</th><th>置信度</th><th>充分度</th><th>有效期</th><th>岗位数</th></tr></thead><tbody>
    ${company.profiles.map(p => `<tr class="expand"><td>${DIMS[p.dim]}</td><td>${esc(scopeText(p))}</td><td>${dimCell(p.dim, p)}${p.score == null ? ` <span class="sub">${esc(p.reason || "")}</span>` : ""}</td>
      <td class="num">${pct(p.confidence)}</td><td class="num">${pct(p.evidence_sufficiency)}</td>
      <td class="num">${esc(p.valid_until || "—")}${expired(p) ? " " + pill("expired") : ""}</td><td class="num">${p.jobCount}</td></tr>`).join("")}
    </tbody></table>
    <div class="section-title">引用岗位</div>
    <table class="dim-table"><tbody>${company.jobs.map(j => `<tr data-id="${j.id}">
      <td class="num">${j.id}</td><td><span class="role">${esc(j.role)}</span>${jobLink(j)}</td><td>${esc(j.location || "—")}</td>
      <td>${dims(j.scores, j.dimensions)}</td><td>${pill(j.action)}</td><td>${pill(j.application_status)}</td></tr>`).join("")}</tbody></table>`;
}
function companyRows(all) {
  const q = state.q.trim().toLowerCase();
  return sorted(all.filter(c => !q || c.name.toLowerCase().includes(q)), COMPANY_COLUMNS).map(c => `
    <tr data-company-id="${esc(c.id)}" class="${openCompany === c.id ? "selected" : ""}">
      <td><span class="role">${esc(c.name)}</span></td>
      ${COMPANY_DIMS.map(k => `<td>${companyDimCell(c, k)}</td>`).join("")}
      <td class="num">${c.avg == null ? "—" : c.avg.toFixed(2)}</td>
      <td class="num">${c.jobCount}</td>
      <td class="num">${esc(c.valid_until || "—")}${expired(c) ? " " + pill("expired") : ""}</td>
    </tr>${openCompany === c.id ? `<tr class="expand"><td colspan="${COMPANY_COLUMNS.length}">${companyDetail(c)}</td></tr>` : ""}`);
}

function render() {
  const companyView = state.stage === "companies";
  const allCompanies = companies();
  const [sortKey, dirKey] = sortKeys();
  $("stageTabs").innerHTML = STAGES.map(s =>
    `<button class="tab ${state.stage === s.key ? "active" : ""}" data-stage="${s.key}">${s.label}<span class="count">${s.key === "companies" ? allCompanies.length : jobs.filter(j => inStage(j, s.key)).length}</span></button>`
  ).join("");
  $("thead").innerHTML = (companyView ? COMPANY_COLUMNS : COLUMNS).map(c =>
    `<th data-sort="${c.key}" class="${c.cls || ""} ${state[sortKey] === c.key ? "sorted" : ""}">${c.label}${state[sortKey] === c.key ? `<span class="arrow">${state[dirKey] === "asc" ? "▲" : "▼"}</span>` : ""}</th>`
  ).join("");
  $("filters").classList.toggle("companies", companyView);
  const list = companyView ? companyRows(allCompanies) : sorted(filtered(), COLUMNS);
  $("empty").hidden = list.length > 0;
  $("empty").textContent = companyView ? "没有符合条件的公司" : "没有符合条件的职位";
  $("rows").innerHTML = companyView ? list.join("") : list.map(j => `
    <tr data-id="${j.id}" class="${detail && detail.id === j.id ? "selected" : ""}">
      <td class="num">${j.id}</td>
      <td><div class="role">${esc(j.role)}${jobLink(j)}</div><div class="sub">${esc(j.company)} · ${esc(j.source)}${j.material_count ? " · 📎 材料" : ""}${runs[j.id]?.status === "running" ? ` · ⏳ ${ACTION_TEXT[runs[j.id].action].running}` : ""}</div></td>
      <td class="hide-sm">${esc(j.location || "—")}</td>
      <td>${dims(j.scores, j.dimensions)}${j.needs_rescore ? pill("needs_rescore") : ""}</td>
      <td class="num hide-sm" title="核心必备：直接 · 相邻 · 缺口 · 未知">${capabilityCell(j.capability_counts)}</td>
      <td title="${j.needs_rescore ? "基于上次评分，待重新评分" : ""}">${pill(j.action)}</td>
      <td>${pill(j.state)}</td>
      <td>${pill(j.application_status)}</td>
      <td class="num hide-sm">${shortDate(j.created_at)}</td>
      <td class="num hide-sm">${shortDate(j.scored_at)}</td>
    </tr>`).join("");
  ["q", "fAction"].forEach(id => {
    const key = { q: "q", fAction: "action" }[id];
    if ($(id).value !== String(state[key])) $(id).value = state[key];
  });
  $("fMaterials").checked = state.materials;
  saveState();
}

async function openJob(id, tab = "overview") {
  $("drawer").classList.add("open");
  $("drawer").setAttribute("aria-hidden", "false");
  $("dTitle").textContent = "加载中…";
  $("dMeta").innerHTML = "";
  $("dBody").innerHTML = "";
  history.replaceState(null, "", `#job=${id}&tab=${tab}`);
  try {
    const response = await fetch(`/api/jobs/${id}`);
    const body = await readJson(response);
    if (!response.ok) throw new Error(body.error || response.statusText);
    detail = body;
    detail.tab = tab;
    renderDetail();
    render();
  } catch (error) {
    $("dBody").innerHTML = `<div class="error">加载失败：${esc(error.message)}</div>`;
  }
}

function closeJob() {
  $("drawer").classList.remove("open");
  $("drawer").setAttribute("aria-hidden", "true");
  detail = null;
  history.replaceState(null, "", location.pathname);
  render();
}

function renderDetail() {
  const d = detail;
  $("dTitle").innerHTML = `${esc(d.role)} ${jobLink(d, "打开职位 ↗")}`;
  $("dMeta").innerHTML = [esc(d.company), `#${d.id}`, esc(d.location || ""), pill(d.stage), pill(d.action), pill(d.application_status)]
    .filter(Boolean).join(" ");
  const badge = { materials: d.materials.length, interviews: d.interviews.length, timeline: d.application_events.length + d.application_activity.length };
  $("dTabs").innerHTML = DETAIL_TABS.map(t =>
    `<button class="tab ${d.tab === t.key ? "active" : ""}" data-tab="${t.key}">${t.label}${badge[t.key] ? `<span class="count">${badge[t.key]}</span>` : ""}</button>`
  ).join("");
  $("dActions").innerHTML = actions(d);
  history.replaceState(null, "", `#job=${d.id}&tab=${d.tab}`);
  $("dBody").innerHTML = ({ overview, report, jd, materials, interviews, timeline })[d.tab](d);
  $("dBody").scrollTop = 0;
}

function overview(d) {
  const artifact = d.scan_artifact || {};
  const rows = [
    ["职位链接", `<a href="${esc(safeUrl(d.url))}" target="_blank" rel="noopener noreferrer">${esc(d.url)}</a>`],
    ["公司", esc(d.company)], ["来源", esc(d.source)], ["地点", esc(d.location || "—")],
    ["流程状态", pill(d.state)], ["存活", `${pill(d.liveness)} <span class="sub">${esc(d.liveness_reason || "")}</span>`],
    ["预筛", pill(d.prescreen)], ["资格", pill(d.eligibility)],
    ["决策", pill(d.action)],
    ["活跃检查时间", esc(d.liveness_checked_at || "—")], ["上次确认活跃", esc(d.liveness_last_active_at || "—")],
    ["发现时间", esc(d.created_at)], ["抓取时间", esc(d.captured_at || "—")], ["打分时间", esc(d.scored_at || "—")],
    ["投递状态", `${pill(d.application_status)} <span class="sub">${esc(d.application_updated_at || "")}</span>`],
  ];
  const prescreen = artifact.prescreen || {};
  const findings = [...(prescreen.discard_reasons || []), ...(prescreen.uncertainties || []), ...(prescreen.missing || [])];
  const evidence = d.eligibility_detail ? (d.eligibility_detail.evidence.evidence || d.eligibility_detail.evidence.uncertainties || []) : [];
  return `<dl class="kv">${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("")}</dl>
    ${dimTable(d)}
    ${findings.length ? `<div class="section-title">预筛发现</div>${findings.map(evidenceCard).join("")}` : ""}
    ${evidence.length ? `<div class="section-title">资格证据</div>${evidence.map(evidenceCard).join("")}` : ""}
    ${capabilityTable(d.capability_rows || [])}`;
}

const VERDICTS = { proven: "直接", adjacent: "相邻", gap: "缺口", unverified: "未知" };
function capabilityCell(counts) {
  return counts ? `${counts.proven}·${counts.adjacent}·${counts.gap}·${counts.unverified}` : "—";
}
function capabilityTable(rows) {
  if (!rows.length) return "";
  return `<div class="section-title">能力匹配</div><table class="dim-table"><thead><tr><th>类别</th><th>要求</th><th>判定</th><th>依据</th></tr></thead><tbody>${
    rows.map(r => `<tr><td>${esc(r.tier)}</td><td>${esc(r.requirement)}</td><td class="verdict">${esc(VERDICTS[r.match])}</td><td><span class="sub">${esc(r.evidence)}</span></td></tr>`).join("")}</tbody></table>`;
}

function evidenceCard(item) {
  if (typeof item !== "object" || !item) return `<div class="card">${esc(item)}</div>`;
  const lines = Array.isArray(item.evidence) ? item.evidence : item.evidence ? [item.evidence] : [];
  return `<div class="card"><h4>${pill(item.gate || item.code)} ${esc(item.message || item.code || "")}</h4>
    ${lines.map(line => `<div class="sub">• ${esc(typeof line === "string" ? line : JSON.stringify(line))}</div>`).join("")}</div>`;
}

function refreshReason(d) {
  const labels = { inputs_changed: "简历、JD、资料或打分规则已变化", company_evidence_expired: "公司证据已过期" };
  return (d.refresh_reasons || []).map(reason => labels[reason] || reason).join("；");
}

function report(d) {
  const refresh = d.needs_rescore ? `<div class="banner failed">待重新评分：${refreshReason(d)}。请点击上方「重新打分」。</div>` : "";
  return runBanner(d, "rescore") + refresh + (d.report ? `<div class="report">${md(d.report)}</div>` : '<p class="sub">该职位尚无打分报告。</p>');
}
function jd(d) { return d.jd ? `<pre class="plain">${esc(d.jd)}</pre>` : '<p class="sub">未保留 JD 原文。</p>'; }

const ACTION_TEXT = {
  prepare: { running: "正在生成材料", failed: "生成材料失败", done: "materials",
    banner: "正在生成：简历 PDF、Cover letter、面试准备、Upskill、反问问题…",
    confirm: job => `为「${job.company} · ${job.role}」生成申请材料？\n\n会用你的简历、资料和该职位打分结果调用模型，生成简历 PDF、Cover letter、面试准备、Upskill 和反问问题。\n不会提交申请。` },
  rescore: { running: "正在重新打分", failed: "重新打分失败", done: "report",
    banner: "正在用当前简历、资料和打分规则重新打分（复用已保存的 JD，不重新抓取）…",
    confirm: job => `用当前简历、资料和打分规则重新给「${job.company} · ${job.role}」打分？\n\n会调用模型并覆盖旧的打分报告；复用已保存的 JD，不重新抓取页面。` },
};

function actionButton(id, action, label, primary = true) {
  return `<button class="${primary ? "primary" : "ghost"}" data-action="${action}" data-job="${id}">${label}</button>`;
}

function actions(d) {
  const run = runs[d.id];
  const task = d.apply_task;
  if (run?.status === "running") {
    return `<button class="primary" disabled>⏳ ${ACTION_TEXT[run.action].running}…</button><span class="sub">通常需要几分钟，可以关闭面板，完成后会自动刷新</span>`;
  }
  if (d.scan_outcome !== "jd_report") return `<span class="sub">没有可用的 JD 扫描结果，暂不能打分或生成材料</span>`;
  if (!d.scores) return `${actionButton(d.id, "rescore", "开始打分")}<span class="sub">打分后才能生成申请材料</span>`;
  if (d.needs_rescore) {
    return `${pill("needs_rescore")} ${actionButton(d.id, "rescore", "重新打分")}
      <button class="ghost" disabled title="待重新评分">生成申请材料</button>
      <span class="sub">${esc(refreshReason(d))}</span>`;
  }
  const label = d.materials.length ? "重新生成材料" : "生成申请材料";
  return `${actionButton(d.id, "prepare", label)}<span class="sub">不会提交申请</span>`;
}

function runBanner(d, action) {
  const run = runs[d.id];
  if (!run || run.action !== action) return "";
  if (run.status === "running") return `<div class="banner">⏳ ${ACTION_TEXT[action].banner}</div>`;
  if (run.status === "failed") return `<div class="banner failed"><strong>${ACTION_TEXT[action].failed}</strong><pre>${esc(run.error || "")}</pre></div>`;
  if (run.task && run.task.status !== "completed" && action === "rescore") {
    return `<div class="banner">打分任务状态：${pill(run.task.status)} ${esc(run.task.reason || "")}</div>`;
  }
  return "";
}

function prepareBanner(d) {
  const task = d.apply_task;
  const banner = runBanner(d, "prepare");
  if (banner) return banner;
  if (task?.status === "waiting") {
    return `<div class="banner failed"><strong>上次生成未完成</strong>（${esc(task.reason || "")}），点击上方按钮重试。</div>`;
  }
  if (d.materials_current === false) {
    return '<div class="banner failed">此材料基于旧版 JD、简历、资料或打分，建议点击上方「重新生成材料」。</div>';
  }
  return "";
}

async function startAction(id, action) {
  const job = jobs.find(j => j.id === id) || detail;
  if (!confirm(ACTION_TEXT[action].confirm(job))) return;
  try {
    const response = await fetch(`/api/jobs/${id}/${action}`, { method: "POST", headers: { "X-Career-Ops": "dashboard" } });
    const body = await readJson(response);
    if (!response.ok) throw new Error(body.error || response.statusText);
    runs[id] = body.run;
    if (detail && detail.id === id) detail.tab = ACTION_TEXT[action].done;
    refreshViews(id);
    pollRun(id);
  } catch (error) {
    alert("无法开始：" + error.message);
  }
}

async function pollRun(id) {
  while (runs[id]?.status === "running") {
    await new Promise(resolve => setTimeout(resolve, POLL_MS));
    try {
      const response = await fetch(`/api/jobs/${id}/run`);
      const body = await readJson(response);
      runs[id] = body.run || { ...runs[id], status: "failed", error: "服务已重启，无法跟踪该任务；请刷新查看结果" };
    } catch { /* keep polling through transient errors */ }
  }
  await loadJobs();
  if (detail && detail.id === id) openJob(id, ACTION_TEXT[runs[id].action]?.done || "overview");
}

function refreshViews(id) {
  render();
  if (detail && detail.id === id) renderDetail();
}

function materials(d) {
  const banner = prepareBanner(d);
  if (!d.materials.length) {
    return `${banner}<p class="sub">暂无投递材料。点击上方「生成申请材料」生成简历 PDF、Cover letter、面试准备、Upskill 和反问问题。</p>`;
  }
  // Only the PDF opens outside the page; every Markdown file renders here.
  const texts = d.materials.filter(m => m.content != null);
  const current = texts.find(m => m.id === d.material) || texts[0];
  const nav = d.materials.map(m => {
    if (m.content != null) return `<button class="ghost ${m === current ? "active" : ""}" data-material="${esc(m.id)}">${esc(m.label)}</button>`;
    if (!m.exists) return `<span class="pill discard">${esc(m.label)} 文件缺失</span>`;
    return `<a class="ghost" href="/api/jobs/${d.id}/file?id=${encodeURIComponent(m.id)}" target="_blank" rel="noopener">${esc(m.label)} ↗</a>`;
  }).join("");
  return `${banner}<div class="material-nav">${nav}</div>${current ? md(current.content) : ""}`;
}

function interviews(d) {
  if (!d.interviews.length) {
    return `<p class="sub">暂无已确认的面试准备。可运行 <code>.venv/bin/python -B -m career_ops interview preparation-plan ${d.id}</code> 或开始面试准备会话。</p>`;
  }
  return d.interviews.map(item => `<details class="card" open><summary>${pill(item.kind)} ${esc(item.session)} <span class="sub">${esc(item.confirmed_at)}</span></summary>
    ${renderArtifact(item.artifact)}</details>`).join("");
}

function renderArtifact(value) {
  if (typeof value === "string") return md(value);
  if (Array.isArray(value)) {
    if (value.length && value.every(v => v && typeof v === "object" && !Array.isArray(v))) {
      const keys = [...new Set(value.flatMap(Object.keys))];
      return `<div class="md"><table><thead><tr>${keys.map(k => `<th>${esc(k)}</th>`).join("")}</tr></thead><tbody>${
        value.map(row => `<tr>${keys.map(k => `<td>${esc(typeof row[k] === "object" ? JSON.stringify(row[k]) : row[k])}</td>`).join("")}</tr>`).join("")
      }</tbody></table></div>`;
    }
    return `<ul>${value.map(v => `<li>${renderArtifact(v)}</li>`).join("")}</ul>`;
  }
  if (value && typeof value === "object") {
    return Object.entries(value).map(([k, v]) => `<div class="section-title">${esc(k)}</div>${renderArtifact(v)}`).join("");
  }
  return esc(value);
}


const STATUS_TEXT = {
  responded: "对方已回复", interview_progress: "进入面试 / 新一轮面试", offer_received: "收到 offer", hired: "已入职",
  offer_declined: "拒绝 offer", rejected: "被拒", no_response: "无回应，不再跟进", interview_only: "面试后无下文",
};
const URGENCY_TEXT = { urgent: "紧急", overdue: "已到跟进时间", waiting: "等待中", cold: "已冷却" };
const today = () => new Date().toLocaleDateString("sv-SE");

function recordForm(kind, label, fields) {
  return `<div class="card"><h4>${label}</h4><form class="record" data-record="${kind}">
    <input type="hidden" name="key" value="${crypto.randomUUID()}">${fields}
    <input name="notes" placeholder="备注（可选）" maxlength="2000">
    <button class="primary" type="submit">保存</button><div class="error" hidden></div></form></div>`;
}
const dateInput = (value = today(), max = today()) =>
  `<input type="date" name="date" required value="${value}"${max ? ` max="${max}"` : ""}>`;

function followupSummary(d) {
  if (d.followup === undefined) loadFollowup(d.id);
  const f = d.followup;
  if (f === undefined || f === "loading") return '<p class="sub">正在读取跟进节奏…</p>';
  if (f?.error) return `<p class="error">读取跟进节奏失败：${esc(f.error)}</p>`;
  if (!f) return '<p class="sub">该投递已结束或不在跟进中。</p>';
  const next = f.nextFollowupDate ? `下次跟进 <strong>${esc(f.nextFollowupDate)}</strong>（${f.daysUntilNext >= 0 ? `${f.daysUntilNext} 天后` : `已过 ${-f.daysUntilNext} 天`}）` : "暂无下次跟进日期";
  return `<p>${pill(f.urgency)} ${esc(URGENCY_TEXT[f.urgency] || f.urgency)} · ${next} · <span class="sub">上次跟进 ${esc(f.lastFollowupAt || "—")}</span></p>`;
}

function recordPanel(d) {
  if (!d.application_status) {
    return recordForm("submit", "标记已投递", dateInput());
  }
  const options = d.status_options.map(v => `<option value="${v}">${esc(STATUS_TEXT[v] || v)}</option>`).join("");
  return followupSummary(d)
    + (options ? recordForm("status", "更新投递状态", `<select name="value" required>${options}</select>`) : "")
    + recordForm("followup", "记录已发跟进", dateInput())
    + recordForm("schedule", "设定下次跟进日期", dateInput("", ""));
}

async function loadFollowup(id) {
  detail.followup = "loading";
  let followup;
  try {
    const response = await fetch(`/api/jobs/${id}/followup`);
    const body = await readJson(response);
    if (!response.ok) throw new Error(body.error || response.statusText);
    followup = body.followup;
  } catch (error) {
    followup = { error: error.message };
  }
  if (detail?.id === id) { detail.followup = followup; if (detail.tab === "timeline") renderDetail(); }
}

async function saveRecord(form) {
  const error = form.querySelector(".error");
  const button = form.querySelector("button");
  const id = detail.id;
  button.disabled = true;
  error.hidden = true;
  try {
    const response = await fetch(`/api/jobs/${id}/record`, {
      method: "POST", headers: { "X-Career-Ops": "dashboard", "Content-Type": "application/json" },
      body: JSON.stringify({ kind: form.dataset.record, ...Object.fromEntries(new FormData(form)) }),
    });
    const body = await readJson(response);
    if (!response.ok) throw new Error(body.error || response.statusText);
    await loadJobs();
    if (detail?.id === id) await openJob(id, "timeline");
  } catch (e) {
    error.textContent = "保存失败：" + e.message;
    error.hidden = false;
    button.disabled = false;
  }
}

function timeline(d) {
  return `${recordPanel(d)}<div class="section-title">历史记录</div>${timelineItems(d)}`;
}

function timelineItems(d) {
  const items = [
    ...d.application_events.map(e => ({ at: e.created_at, title: `${e.from_status || "—"} → ${e.to_status}`, tag: e.action, source: e.source, payload: e.payload })),
    ...d.application_activity.map(e => ({ at: e.created_at, title: e.type, tag: "activity", source: e.source, payload: e.payload })),
    ...d.followups.map(e => ({ at: e.created_at, title: `跟进 ${e.kind}${e.next_date ? " · " + e.next_date : ""}`, tag: "followup", source: e.source, payload: e.payload })),
  ].sort((a, b) => String(b.at).localeCompare(String(a.at)));
  if (!items.length) return '<p class="sub">尚无投递记录。</p>';
  return items.map(i => `<div class="card"><h4>${pill(i.tag)} ${esc(i.title)} <span class="sub">${esc(i.at)} · ${esc(i.source || "")}</span></h4>
    ${i.payload && Object.keys(i.payload).length ? renderArtifact(i.payload) : ""}</div>`).join("");
}

document.addEventListener("click", event => {
  const target = event.target.closest("[data-stage],[data-sort],tr[data-id],tr[data-company-id],[data-tab],[data-material],[data-action]");
  if (!target) return;
  if (target.dataset.action) startAction(Number(target.dataset.job), target.dataset.action);
  else if (target.dataset.stage) { state.stage = target.dataset.stage; render(); }
  else if (target.dataset.sort) {
    const [sortKey, dirKey] = sortKeys();
    state[dirKey] = state[sortKey] === target.dataset.sort && state[dirKey] === "desc" ? "asc" : "desc";
    state[sortKey] = target.dataset.sort;
    render();
  } else if (target.dataset.companyId) { openCompany = openCompany === target.dataset.companyId ? null : target.dataset.companyId; render(); }
  else if (target.dataset.id) openJob(Number(target.dataset.id), state.stage === "applied" ? "materials" : state.stage === "scored" ? "report" : "overview");
  else if (target.dataset.tab) { detail.tab = target.dataset.tab; renderDetail(); }
  else if (target.dataset.material) { detail.material = target.dataset.material; renderDetail(); }
});
const bind = (id, key, read = el => el.value) => $(id).addEventListener("input", e => { state[key] = read(e.target); render(); });
bind("q", "q"); bind("fAction", "action"); bind("fState", "state"); bind("fSource", "source");
bind("fLiveness", "liveness"); bind("fMaterials", "materials", el => el.checked);
$("reset").addEventListener("click", () => {
  state = { ...state, q: "", action: "", state: "", source: "", liveness: "", materials: false };
  fillSelects(); render();
});
$("refresh").addEventListener("click", loadJobs);
$("close").addEventListener("click", closeJob);
document.addEventListener("submit", event => {
  const form = event.target.closest("form[data-record]");
  if (!form) return;
  event.preventDefault();
  saveRecord(form);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && detail) closeJob(); });

loadJobs().then(() => {
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.get("job")) openJob(Number(params.get("job")), params.get("tab") || "overview");
});
</script>
</body>
</html>
